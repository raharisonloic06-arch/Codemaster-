<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — CodeMaster</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080a10;color:#eef1f8;font-family:Inter,sans-serif;}
  .box{max-width:420px;width:100%;padding:34px;border-radius:20px;background:#151a25;border:1px solid rgba(255,255,255,.08);}
  h1{font-size:20px;margin:0 0 8px;font-family:'Space Grotesk',sans-serif;}
  p{color:#a7b0c2;font-size:14px;line-height:1.6;margin:0 0 20px;}
  label{font-size:12.5px;color:#a7b0c2;display:block;margin-bottom:7px;font-weight:500;}
  input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0d1017;color:#eef1f8;font-size:14px;outline:none;margin-bottom:16px;}
  button{width:100%;padding:12px;border-radius:11px;border:none;background:linear-gradient(135deg,#2dd9c8,#9d7cf0);color:#04141a;font-weight:700;font-size:14.5px;cursor:pointer;}
  #status{margin-top:14px;font-size:13.5px;text-align:center;}
  .ok{color:#57e08a;} .err{color:#f0668a;}
</style>
</head>
<body>
  <div class="box">
    <h1>Nouveau mot de passe</h1>
    <p>Choisis un mot de passe d'au moins 6 caractères.</p>
    <label>Nouveau mot de passe</label>
    <input type="password" id="pw1" placeholder="••••••••">
    <label>Confirmer le mot de passe</label>
    <input type="password" id="pw2" placeholder="••••••••">
    <button onclick="submitReset()">Réinitialiser le mot de passe</button>
    <div id="status"></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    async function submitReset(){
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const status = document.getElementById('status');
      status.className=''; status.textContent='';
      if(!token){ status.textContent='Lien invalide : token manquant.'; status.className='err'; return; }
      if(pw1.length < 6){ status.textContent='Le mot de passe doit contenir au moins 6 caractères.'; status.className='err'; return; }
      if(pw1 !== pw2){ status.textContent='Les deux mots de passe ne correspondent pas.'; status.className='err'; return; }
      try{
        const res = await fetch('/api/auth/reset-password', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, newPassword: pw1 })
        });
        const data = await res.json();
        if(res.ok){ status.textContent = data.message + ' Redirection...'; status.className='ok'; setTimeout(()=>location.href='/', 1800); }
        else { status.textContent = data.error; status.className='err'; }
      }catch(e){ status.textContent='Erreur réseau, réessaie.'; status.className='err'; }
    }
  </script>
</body>
</html>
