version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codemaster
      POSTGRES_PASSWORD: codemaster
      POSTGRES_DB: codemaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Judge0 = moteur d'exécution de code sandboxé (isolation via containers éphémères).
  # Sert à exécuter en toute sécurité le code Python/Java/C++/JS soumis par les utilisateurs
  # dans les défis, sans jamais exécuter du code utilisateur sur le serveur principal.
  # Doc complète : https://github.com/judge0/judge0
  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=judge0-redis
      - POSTGRES_HOST=judge0-db
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
  judge0-db-data:
